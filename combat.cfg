# External combat balance. Read from the working directory at startup.
# Restart the game after editing. This file stays outside blobwars.pak.
# Times are simulation frames (62 frames = 1 second), distances are pixels.
# CHANCE values are percentages; PERMILLE is per thousand; booleans are 0/1.
# Missing keys use built-in defaults. Invalid keys/values are reported and ignored.

# lost per frame once the hold time is over
AWARE_DECAY = 0.16
# frames an alerted enemy keeps looking before calming down
ALERT_HOLD = 360
# same for an enemy that was only suspicious
SUSPICIOUS_HOLD = 120
# farthest they can notice you
VISION_RANGE = 720
# they only notice you behind their back this close
BEHIND_RANGE = 96
# what allies get told when someone spots you / is shot
ALLY_ALERT_LEVEL = 65
# what a nearby gunshot does
HEAR_LEVEL = 45
# chain alert radius
ALERT_RANGE_X = 300
ALERT_RANGE_Y = 150
# how far a gunshot is heard
HEAR_RANGE_X = 420
HEAR_RANGE_Y = 220
# extra wait after a burst
BURST_PAUSE = 50
# pistol, machine gun
DIST_CLOSE = 150
# laser, spread
DIST_MEDIUM = 300
# grenades, rockets
DIST_FAR = 450
ENEMY_SEPARATION = 64
# about 2 seconds
GRENADE_COOLDOWN = 120
# stay this far from own grenade
GRENADE_SAFE_DISTANCE = 150
# extra hold time of a full-power throw (about 0.75 s)
GRENADE_CHARGE_FRAMES = 45
# energy before it has to reload
LASER_CLIP_SIZE = 12
# reload time on the easiest difficulty
LASER_RELOAD_FRAMES = 150
# frames shaved off per difficulty level
LASER_RELOAD_SKILL_CUT = 20
# % of volleys that are bursts
LASER_BURST_CHANCE = 35
# % of sweeps on the easiest difficulty...
LASER_SWEEP_BASE_CHANCE = 10
# ...plus this per difficulty level
LASER_SWEEP_SKILL_CHANCE = 10
# bullets in a sweep, plus 1 per difficulty level
LASER_SWEEP_SHOTS = 4
# frames between the bullets of a sweep
LASER_SWEEP_GAP = 5
# extra warning before a sweep
LASER_SWEEP_WARNING = 12
# pixels around the player the sweep covers
LASER_SWEEP_HALF_WIDTH = 55
# degrees, half width of the fan
LASER_SWEEP_MIN_ANGLE = 4
LASER_SWEEP_MAX_ANGLE = 25
# % of beams on the easiest difficulty...
LASER_BEAM_BASE_CHANCE = 10
# ...plus this per difficulty level
LASER_BEAM_SKILL_CHANCE = 10
# how long the beam stays on (1.5 s)
LASER_BEAM_FRAMES = 90
# energy one whole beam uses; it can still fire when other modes do not fit
LASER_BEAM_CLIP_COST = 3
# extra warning before a beam
LASER_BEAM_WARNING = 12
# frames between two hits while the beam touches Bob
LASER_BEAM_TICK = 15
# health Bob loses per hit (health is a whole number: the beam is weaker through its rate, not through each hit)
LASER_BEAM_DAMAGE = 1
# longest the beam can be (pixels)
LASER_BEAM_RANGE = 720
# pixels between the points tested along the beam
LASER_BEAM_STEP = 4
# pixels around the player the beam sweeps across
LASER_BEAM_HALF_WIDTH = 55
# degrees, half width of the sweep
LASER_BEAM_MIN_ANGLE = 4
LASER_BEAM_MAX_ANGLE = 25
BIOMECH_LASER_CLIP_SIZE = 12
BIOMECH_LASER_RELOAD = 620
BIOMECH_USES_ALL_LASER_MODES = 0
BIOMECH_VOLLEY_COOLDOWN = 84
BIOMECH_KEEPS_DISTANCE = 0
BIOMECH_ATTACK_ANIMATION_FRAMES = 24
BIOMECH_MELEE_DAMAGE = 2
BIOMECH_MELEE_PARTICLE_RANGE = 128
BIOMECH_MELEE_PARTICLE_GAP = 8
BIOMECH_MELEE_COOLDOWN = 62
# shield points at spawn
DROID_SHIELD_POINTS = 5
# teleport dashes in the pool
DROID_MAX_DASHES = 3
# shield points one dash consumes (the shield has DROID_SHIELD_POINTS)
DASH_SHIELD_COST = 1
# once the shield breaks (or the dashes run out) it is back, full, after 10 s (not before)
DROID_RECHARGE_FRAMES = 620
# the aggression penalty can never push the timer past this
DROID_RECHARGE_CAP = 620
# a direct hit with the shield down freezes it this long
DROID_STAGGER_FRAMES = 4
# ...and it can't be frozen again for this long (no stun-lock)
DROID_STAGGER_IMMUNITY = 20
# shield points one grenade deflection consumes
DROID_DEFLECT_COST = 2
# the repulsor field reaches this far (pixels) beyond the droid's half size
DROID_DEFLECT_MARGIN = 40
# a dash jumps at least this far (pixels)
DASH_MIN_RADIUS = 64
# ...and at most this far
DASH_MAX_RADIUS = 160
# candidate spots tested per dash
DASH_TRIES = 8
# frames between two dashes
DASH_COOLDOWN = 40
# % chance to dash after being hit (0: it no longer reacts to hits, it dodges the shot itself)
DASH_HIT_CHANCE = 0
# % chance that a droid in the line of fire dashes the instant the player shoots
DASH_DODGE_CHANCE = 100
# farthest a droid reacts to a shot (pixels along the line of fire)
DASH_DODGE_RANGE = 1000
# extra pixels a dodge spot keeps from the line of fire (on top of the droid's half size)
DASH_DODGE_CLEARANCE = 40
# the player this close (pixels) makes it dash away
DASH_CLOSE_RANGE = 110
# % per frame while the player is that close
DASH_CLOSE_CHANCE = 8
# per-mille per frame of a random dash while alert and seeing the player
DASH_IDLE_PERMILLE = 4
# it crawls: it only moves on one frame in this many
DROID_SAFE_MOVE_PERIOD = 3
# frames between dashes in safe mode (dodging is what it concentrates on)
DASH_SAFE_COOLDOWN = 20
# % per frame to dash away while Bob is within DASH_CLOSE_RANGE
DASH_SAFE_CLOSE_CHANCE = 30
# cover points are looked for in rings this far apart (pixels)...
DROID_COVER_STEP = 48
# ...up to this far from the droid
DROID_COVER_RADIUS = 288
# points tested per ring
DROID_COVER_DIRS = 12
# frames between checks that the chosen cover is still hidden from Bob
DROID_COVER_RECHECK = 15
# frames to wait before searching again after finding nothing
DROID_COVER_RETRY = 30
# frames between the checks that it is getting closer to its cover
DROID_COVER_STUCK_FRAMES = 45
# moving less than this (pixels) between two checks = stuck, the spot is dropped
DROID_COVER_STUCK_MOVE = 3
# this close (pixels, x plus y) to the spot counts as arrived
DROID_COVER_ARRIVE_DIST = 8
# candidate spots tested per dash in safe mode (it looks for one Bob can't see)
DASH_TRIES_HIDDEN = 16
# Bob with this much health or less (and in its sights) tempts it to shoot
DROID_AGGRO_BOB_HEALTH = 2
# % per frame that it gives in to that temptation
DROID_AGGRO_CHANCE = 10
# closer than this (pixels) it prefers a burst, farther a beam
DROID_AGGRO_BURST_RANGE = 200
# a single shot from safe mode adds this to the recharge (up to DROID_RECHARGE_CAP)
DROID_AGGRO_PENALTY_FRAMES = 310
